<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>منيو {{NAME_AR}}</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 18px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: #0f0d0b;
    background: radial-gradient(120% 90% at 50% 118%, #5C3A1E 0%, #3D2B1F 55%, #0f0d0b 100%);
    color: #fff;
    font-family: var(--font-body, system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif);
    -webkit-text-size-adjust: 100%;
  }
  .portal-card {
    text-align: center;
    width: 100%;
    max-width: 380px;
  }
  .portal-card__ring {
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 3px solid var(--brown-gold, #b8860b);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #17110b;
  }
  .portal-card__ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .portal-card__title {
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 6px;
  }
  .portal-card__lead {
    font-size: 14px;
    color: #e9d9bd;
    margin: 0 0 24px;
    line-height: 1.7;
  }
  .enter-btn {
    display: block;
    width: 100%;
    background: linear-gradient(90deg, {{ACCENT}}, {{ACCENT_DEEP}});
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 16px 22px;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 3px 14px {{GLOW}};
  }
  .portal-card__hint {
    font-size: 12px;
    color: #9a8f80;
    margin-top: 22px;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="portal-card">
    <div class="portal-card__ring"><img src="/images/logo.png?v=3" alt="{{NAME_AR}}" width="110" height="110" decoding="async" onerror="this.style.display='none'"></div>
    <h1 class="portal-card__title">أهلًا بك في منيو {{NAME_AR}}</h1>
    <p class="portal-card__lead">اطلب من جوالك مباشرةً — خذ رقم طلبك وادفع عند الكاشير</p>
    <a class="enter-btn" href="/menu">دخول المنيو</a>
    <p class="portal-card__hint">متصل بشبكة المطعم · عند أي استفسار نادِ الكاشير</p>
  </div>
</body>
</html>
