<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | {{NAME_AR}}</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div class="dash-shell">
  <aside class="sidebar">
    <div class="sidebar__brand"><img src="/images/logo.png?v=2" alt="{{NAME_AR}}">{{NAME_AR}}</div>
    <div class="sidebar__caption">عمليات اليوم</div>
    <div class="sidebar__link" data-view="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      الطلبات والفواتير<span class="nav-badge" id="badgeOrders" hidden></span>
    </div>
    <div class="sidebar__link" data-view="tables">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg>
      الطاولات والجلسات
    </div>
    <div class="sidebar__caption">الإدارة والتقارير</div>
    <div class="sidebar__link" data-view="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>
      إدارة المنيو
    </div>
    <div class="sidebar__link" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M11 20V6M17 20v-9"/><path d="M3 20h18"/></svg>
      التقارير
    </div>
    <div class="sidebar__link" data-view="users" id="usersLink">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.6c2.4.4 4 2.6 4 5.4"/></svg>
      المستخدمون
    </div>
    <a class="sidebar__link sidebar__link--ext" href="/api/qr/print" target="_blank" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 16h10v5H7z"/></svg>
      طباعة QR/NFC الطاولات
    </a>
    <div class="sidebar__footer" id="userFooter"></div>
    <button class="btn btn-ghost" id="logoutBtn" style="margin-top:10px;">تسجيل الخروج</button>
  </aside>
  <main class="main-area">
    <div class="topbar">
      <div class="topbar__title" id="viewTitle">نظرة عامة</div>
      <div class="topbar__actions">
        <button class="btn btn-ghost" id="notifyToggleBtn" title="تشغيل / كتم صوت الطلبات الجديدة">كتم صوت الطلبات</button>
        <div class="topbar__user" id="topbarUser"></div>
      </div>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>
<div id="notifyStack"></div>
<script src="/js/admin-api.js"></script>
<script src="/js/admin-overview.js"></script>
<script src="/js/admin-orders.js"></script>
<script src="/js/admin-bills.js"></script>
<script src="/js/admin-tables.js"></script>
<script src="/js/admin-menu.js"></script>
<script src="/js/admin-users.js"></script>
<script src="/js/admin-notify.js"></script>
<script src="/js/admin-app.js"></script>
</body>
</html>
